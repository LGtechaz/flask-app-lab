<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Details</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p><strong>Content:</strong> {{ post.content }}</p>
    <p><strong>Posted on:</strong> {{ post.posted }}</p>
    <p><strong>Category:</strong> {{ post.category }}</p>
    <p><strong>Active:</strong> {{ "Yes" if post.is_active else "No" }}</p>
    <p><strong>Author:</strong> {{ post.author }}</p>

    <a href="{{ url_for('posts.get_posts') }}">Back to all posts</a>
</body>
</html>
