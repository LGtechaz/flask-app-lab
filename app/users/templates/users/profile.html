{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}

<h1>Hi, {{ username }}</h1>

<a href="{{url_for('user_name.logout')}}">logout</a>

<h3>Додати cookie:</h3>
    <form action="{{ url_for('user_name.profile') }}" method="post">
        <label>Ключ cookie:</label>
        <input type="text" name="cookie_key" required> <br>
        <label>Значення cookie:</label>
        <input type="text" name="cookie_value" required> <br>
        <label>Термін дії (у секундах):</label>
        <input type="number" name="cookie_duration" required> <br>
        <button type="submit">Додати cookie</button> <br>
    </form>

    <h3>Видалити cookie за ключем:</h3>
    <form action="{{ url_for('user_name.profile') }}" method="post">
        <label>Ключ cookie для видалення:</label>
        <input type="text" name="delete_cookie_key" required>
        <button type="submit">Видалити cookie</button> <br>
    </form>

    <form action="{{ url_for('user_name.profile') }}" method="post">
        <button type="submit">Видалити всі cookie</button>
    </form>

    <h3>Список всіх cookie:</h3>
    <table>
        <tr>
            <th>Ключ</th>
            <th>Значення</th>
        </tr>
        {% for key, value in cookies.items() %}
        <tr>
            <td>{{ key }}</td>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

{% endblock %}
